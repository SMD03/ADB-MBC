name: Temporary Arco APK Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arco-apk-build-20260926
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - working-directory: arco-apk
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Arco-Base-APK
          path: arco-apk/app/build/outputs/apk/debug/app-debug.apk
