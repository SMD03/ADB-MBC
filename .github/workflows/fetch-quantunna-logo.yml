name: Fetch Quantunna Logo
on:
  push:
    branches: [ main ]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p /tmp/logo
          curl -L --fail "https://upload.wikimedia.org/wikipedia/commons/6/6c/Quantunna.svg" -o /tmp/logo/Quantunna.svg
      - uses: actions/upload-artifact@v4
        with:
          name: quantunna-logo
          path: /tmp/logo/Quantunna.svg
