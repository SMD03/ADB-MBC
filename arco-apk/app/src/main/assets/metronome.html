<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0c"><title>Arco Metronome</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f5f5;background:#090a0c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#25272c 0,#111216 34%,#090a0c 68%);padding:max(20px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));display:flex;justify-content:center}.app{width:min(620px,100%)}.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.back{border:1px solid #34363d;background:#15161a;color:#eee;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}.brand{font-weight:800;font-size:18px}.brand small{display:block;color:#8f949f;font-size:9px;letter-spacing:.16em;margin-top:2px}.card{background:rgba(22,23,27,.96);border:1px solid #303239;border-radius:24px;padding:24px;box-shadow:0 22px 60px #0008}.eyebrow{font-size:11px;color:#9297a2;letter-spacing:.14em;font-weight:800}.tempo{font-size:82px;line-height:1;font-weight:800;letter-spacing:-.05em;text-align:center;margin:22px 0 4px}.bpm{text-align:center;color:#999ea8;font-weight:700}.beats{display:flex;justify-content:center;gap:12px;margin:26px 0 22px}.beat{width:14px;height:14px;border-radius:50%;background:#34363d;transition:.06s}.beat.on{background:#f4f4f5;transform:scale(1.25);box-shadow:0 0 22px #fff7}.beat.accent.on{background:#c8ff5a;box-shadow:0 0 22px #c8ff5a88}.primary{width:100%;border:0;border-radius:16px;padding:16px;background:#f5f5f5;color:#0b0c0e;font-size:16px;font-weight:800}.primary.running{background:#c8ff5a}.row{display:flex;gap:10px;margin-top:12px}.btn{flex:1;border:1px solid #353841;background:#1c1e23;color:#eee;border-radius:13px;padding:12px 8px;font-weight:750}.tap{margin-top:12px}.section{margin-top:22px}.label{display:flex;justify-content:space-between;align-items:center;color:#a4a8b1;font-size:12px;font-weight:700;margin-bottom:9px}.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.seg button{border:1px solid #343740;background:#181a1f;color:#ddd;border-radius:11px;padding:11px 4px;font-weight:750}.seg button.active{background:#eceef2;color:#111;border-color:#eceef2}input[type=range]{width:100%;accent-color:#c8ff5a}.switchline{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #2c2e34;margin-top:20px;padding-top:18px;color:#d8d9dd;font-weight:700}.switch{width:50px;height:28px;border:0;border-radius:20px;background:#383a42;padding:3px}.switch i{display:block;width:22px;height:22px;border-radius:50%;background:#fff;transition:.18s}.switch.on{background:#c8ff5a}.switch.on i{transform:translateX(22px);background:#111}.hint{margin:20px 2px 0;color:#777d88;font-size:12px;line-height:1.55}@media(max-width:420px){.card{padding:20px 16px}.tempo{font-size:70px}.row{gap:7px}.btn{font-size:12px}}
</style></head><body><div class="app"><div class="top"><button class="back" onclick="history.back()">‹ Arco</button><div class="brand">arco<small>MUSIC WORKSPACE</small></div></div><div class="card"><div class="eyebrow">METRONOME</div><div id="tempo" class="tempo">120</div><div class="bpm">BPM</div><div id="beats" class="beats"></div><button id="start" class="primary">Start</button><div class="row"><button class="btn" data-d="-10">−10</button><button class="btn" data-d="-5">−5</button><button class="btn" data-d="-1">−1</button><button class="btn" data-d="1">+1</button><button class="btn" data-d="5">+5</button><button class="btn" data-d="10">+10</button></div><button id="tap" class="btn tap" style="width:100%">Tap tempo</button><div class="section"><div class="label"><span>Tempo</span><span>30–240 BPM</span></div><input id="slider" type="range" min="30" max="240" value="120"></div><div class="section"><div class="label"><span>Time signature</span><span id="sigLabel">4/4</span></div><div id="sigs" class="seg"><button data-beats="2" data-name="2/4">2/4</button><button data-beats="3" data-name="3/4">3/4</button><button class="active" data-beats="4" data-name="4/4">4/4</button><button data-beats="6" data-name="6/8">6/8</button></div></div><div class="section"><div class="label"><span>Click volume</span><span id="volLabel">70%</span></div><input id="vol" type="range" min="0" max="100" value="70"></div><div class="switchline"><span>Accent first beat</span><button id="accent" class="switch on" aria-label="Accent first beat"><i></i></button></div><div class="hint">Uses Web Audio scheduling for steadier timing. The screen stays awake while the metronome is running when Android allows it.</div></div></div><script>
(()=>{let bpm=120,n=4,accent=true,running=false,ctx,timer,next=0,beat=0,wake,taps=[];const $=s=>document.querySelector(s),tempo=$('#tempo'),slider=$('#slider'),beats=$('#beats'),start=$('#start'),vol=$('#vol');function clamp(v){return Math.max(30,Math.min(240,Math.round(v)))}function render(){bpm=clamp(bpm);tempo.textContent=bpm;slider.value=bpm;beats.innerHTML='';for(let i=0;i<n;i++){let d=document.createElement('i');d.className='beat'+(i===0?' accent':'');beats.appendChild(d)}}function set(v){bpm=clamp(v);render()}function click(t,b){const o=ctx.createOscillator(),g=ctx.createGain(),v=+vol.value/100;o.frequency.value=(accent&&b===0)?1500:950;g.gain.setValueAtTime(Math.max(.001,.25*v),t);g.gain.exponentialRampToValueAtTime(.001,t+.045);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.05)}function flash(b,t){const delay=Math.max(0,(t-ctx.currentTime)*1000);setTimeout(()=>{[...beats.children].forEach((x,i)=>x.classList.toggle('on',i===b));setTimeout(()=>beats.children[b]?.classList.remove('on'),80)},delay)}function schedule(){while(next<ctx.currentTime+.12){click(next,beat);flash(beat,next);next+=60/bpm;beat=(beat+1)%n}}async function go(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();running=true;beat=0;next=ctx.currentTime+.06;timer=setInterval(schedule,25);schedule();start.textContent='Stop';start.classList.add('running');try{wake=await navigator.wakeLock?.request('screen')}catch{}}function stop(){running=false;clearInterval(timer);start.textContent='Start';start.classList.remove('running');[...beats.children].forEach(x=>x.classList.remove('on'));wake?.release?.();wake=null}start.onclick=()=>running?stop():go();document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>set(bpm+(+b.dataset.d)));slider.oninput=e=>set(+e.target.value);vol.oninput=()=>$('#volLabel').textContent=vol.value+'%';$('#accent').onclick=e=>{accent=!accent;e.currentTarget.classList.toggle('on',accent)};document.querySelectorAll('#sigs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#sigs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');n=+b.dataset.beats;$('#sigLabel').textContent=b.dataset.name;beat=0;render()});$('#tap').onclick=()=>{let now=performance.now();if(taps.length&&now-taps.at(-1)>2000)taps=[];taps.push(now);if(taps.length>6)taps.shift();if(taps.length>1){let ds=[];for(let i=1;i<taps.length;i++)ds.push(taps[i]-taps[i-1]);set(60000/(ds.reduce((a,b)=>a+b,0)/ds.length))}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&wake){wake.release?.();wake=null}else if(!document.hidden&&running)navigator.wakeLock?.request('screen').then(x=>wake=x).catch(()=>{})});render()})();
</script></body></html>
